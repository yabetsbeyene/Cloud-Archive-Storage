services:
  - type: web
    name: digital-archive-keycloak
    runtime: docker
    plan: free
    dockerfilePath: ./backend/keycloak/Dockerfile
    dockerContext: ./backend/keycloak
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-archive-keycloak-db
          property: connectionString
      - key: KC_DB_USERNAME
        fromDatabase:
          name: digital-archive-keycloak-db
          property: user
      - key: KC_DB_PASSWORD
        fromDatabase:
          name: digital-archive-keycloak-db
          property: password
      - key: KC_HTTP_PORT
        value: "10000"
      - key: KC_HOSTNAME
        fromService:
          type: web
          name: digital-archive-keycloak
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: KC_SERVER_ASYNC_BOOTSTRAP
        value: "false"

  - type: web
    name: digital-archive-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    disk:
      name: document-storage
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: digital-archive-app-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: digital-archive-app-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: digital-archive-app-db
          property: password
      - key: KEYCLOAK_HOSTNAME
        fromService:
          type: web
          name: digital-archive-keycloak
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FILE_STORAGE_LOCATION
        value: /var/data/documents

databases:
  - name: digital-archive-keycloak-db
    plan: free
    databaseName: keycloak
    user: keycloak
    postgresMajorVersion: "16"

  - name: digital-archive-app-db
    plan: free
    databaseName: digital_archive
    user: archive_app
    postgresMajorVersion: "16"
