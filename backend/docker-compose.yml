services:
  # Application database — Flyway (V1__init_schema.sql ... V6) runs against this on app startup.
  postgres-app:
    image: postgres:16-alpine
    container_name: archive-postgres-app
    environment:
      POSTGRES_DB: digital_archive
      POSTGRES_USER: archive_app
      POSTGRES_PASSWORD: archive_app_password
    ports:
      - "5533:5432"
    volumes:
      - archive_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_app -d digital_archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database for Keycloak itself (slide 6: "Keycloak DB — Separate PostgreSQL")
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: archive-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: archive-keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      FRONTEND_URL: http://localhost:5173
    ports:
      - "8081:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy

volumes:
  archive_pg_data:
  keycloak_pg_data:
