services:
  # Application database — Flyway (V1__init_schema.sql ... V6) runs against this on app startup.
  postgres-app:
    image: postgres:16-alpine
    container_name: archive-postgres-app
    environment:
      POSTGRES_DB: digital_archive
      POSTGRES_USER: archive_app
      POSTGRES_PASSWORD: archive_app_password
    ports:
      - "5533:5432"
    volumes:
      - archive_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_app -d digital_archive"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate database for Keycloak itself (slide 6: "Keycloak DB — Separate PostgreSQL")
  postgres-keycloak:
    image: postgres:16-alpine
    container_name: archive-postgres-keycloak
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: archive-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres-keycloak:
        condition: service_healthy

volumes:
  archive_pg_data:
  keycloak_pg_data:
