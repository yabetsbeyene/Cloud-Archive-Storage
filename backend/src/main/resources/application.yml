spring:
  application:
    name: digital-archive-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_archive}
    username: ${DB_USER:archive_app}
    password: ${DB_PASSWORD:archive_app_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/digital-archive}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/digital-archive/protocol/openid-connect/certs}

server:
  port: ${PORT:${SERVER_PORT:8080}}

app:
  file-storage:
    location: ${FILE_STORAGE_LOCATION:./storage}
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:7}
    cleanup-initial-delay-ms: ${AUDIT_CLEANUP_INITIAL_DELAY_MS:10000}
    cleanup-interval-ms: ${AUDIT_CLEANUP_INTERVAL_MS:3600000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  keycloak-admin:
    server-url: ${KEYCLOAK_ADMIN_URL:http://localhost:8081}
    realm: ${KEYCLOAK_ADMIN_REALM:digital-archive}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:archive-backend-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    frontend-client-id: ${KEYCLOAK_FRONTEND_CLIENT_ID:archive-frontend}
    frontend-url: ${FRONTEND_URL:http://localhost:5173}
    invitation-lifespan-seconds: ${INVITATION_LIFESPAN_SECONDS:43200}
