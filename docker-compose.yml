services:
  postgres-app:
    image: postgres:16-alpine
    container_name: archive-postgres-app
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_archive
      POSTGRES_USER: archive_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5533}:5432"
    volumes:
      - archive_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archive_app -d digital_archive"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres-keycloak:
    image: postgres:16-alpine
    container_name: archive-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
    volumes:
      - keycloak_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.0
    container_name: archive-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
    ports:
      - "8025:8025"

  keycloak:
    build:
      context: ./backend/keycloak
      dockerfile: Dockerfile
    container_name: archive-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD in .env}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_PORT: 8080
      KC_HOSTNAME: ${APP_PUBLIC_URL:-http://localhost:5173}/auth
      KC_HTTP_RELATIVE_PATH: /auth
      FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-no-reply@digital-archive.local}
      SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME:-Digital Archive}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      postgres-keycloak:
        condition: service_healthy
      mailpit:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archive-backend
    restart: unless-stopped
    environment:
      DB_HOST: postgres-app
      DB_PORT: 5432
      DB_NAME: digital_archive
      DB_USER: archive_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: ${APP_PUBLIC_URL:-http://localhost:5173}/auth/realms/digital-archive
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/digital-archive/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_REALM: digital-archive
      KEYCLOAK_ADMIN_CLIENT_ID: archive-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      KEYCLOAK_FRONTEND_CLIENT_ID: archive-frontend
      FRONTEND_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      INVITATION_LIFESPAN_SECONDS: 43200
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL:-http://localhost:5173}
      FILE_STORAGE_LOCATION: /app/storage
      PORT: 8080
    volumes:
      - archive_file_storage:/app/storage
    depends_on:
      postgres-app:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_KEYCLOAK_URL: ${APP_PUBLIC_URL:-http://localhost:5173}/auth
        VITE_KEYCLOAK_REALM: digital-archive
        VITE_KEYCLOAK_CLIENT_ID: archive-frontend
    container_name: archive-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
      - keycloak

volumes:
  archive_pg_data:
  keycloak_pg_data:
  archive_file_storage:
